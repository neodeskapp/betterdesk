# The CDAP SDKs (sdks/) and the reference bridges (bridges/) against the
# gateway: neodesk-server/cdap/sdk_examples_test.go runs each SDK's
# example and each bridge with its example config. CDAP_SDK_TESTS=1 makes a
# missing tool or module a failure instead of a skip.
name: CDAP SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'bridges/**'
      - 'neodesk-server/cdap/**'
      - '.github/workflows/cdap-sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'bridges/**'
      - 'neodesk-server/cdap/**'
      - '.github/workflows/cdap-sdk-ci.yml'

permissions:
  contents: read

concurrency:
  group: cdap-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-examples:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    name: SDK examples and bridges against the gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: sdks/nodejs/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Build the Node SDK
        working-directory: sdks/nodejs
        run: |
          npm ci
          npm run build

      # The versions the tests were written against
      - name: Install the Python modules of the SDK and the bridges
        run: python3 -m pip install websockets==17.4 aiohttp==3.14.5 pymodbus==3.16.2

      - name: Run the SDK examples and the bridges against the gateway
        working-directory: neodesk-server
        env:
          CDAP_SDK_TESTS: '1'
        run: go test ./cdap/ -run 'SDKExample|Bridge' -count=1 -v -timeout 10m
