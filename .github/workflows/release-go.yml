# Release of neodesk-server for the in-app updater (console/updater,
# spec updater-installers.md 4.4 and 4.8).
#
# A tag v<X.Y.Z> publishes the stable release v<X.Y.Z>; a tag with a suffix
# (v3.6.0-rc.1) publishes a pre-release, which the stable channel installs
# only while there is no stable release. A push to main (or a
# manual run with channel=development) replaces the pre-release tagged "dev",
# which the development channel installs. Each release holds the binary for
# linux amd64, arm64 and armv7 and windows amd64, the installers and
# compose files of install/ (which neode.sk/install.sh and the like lead
# to, and which the scripts update themselves from), manifest.json,
# SHA256SUMS of all of them (bare file names, for "sha256sum -c"),
# SHA256SUMS.sig, and manifest.sig, signed with the
# secret RELEASE_SIGNING_KEY (the ed25519 private key as PKCS#8 PEM). The
# signature is checked against the release key compiled into the updater,
# and against the variable NEODESK_RELEASE_PUBLIC_KEY when it is set,
# before anything is published; without the secret nothing is published.
name: Release Go server

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'neodesk-server/**'
      - 'web-ui/**'
      - 'install/**'
      - '.github/workflows/release-go.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable (needs a v* tag checked out) or development'
        required: true
        default: development
        type: choice
        options: [stable, development]

permissions:
  contents: read

concurrency:
  group: release-go-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_DIR: neodesk-server

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      created: ${{ steps.plan.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "$SERVER_DIR/internal/productversion/VERSION")"
          # branch is the manifest's name of the update channel (the
          # UPDATE_GITHUB_BRANCH of installs): main for stable, dev for the
          # development build. It is not the git branch the build comes from.
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ "${{ inputs.channel }}" = stable ]; then
            [ "${GITHUB_REF_TYPE}" = tag ] || { echo "a stable release needs a v* tag"; exit 1; }
            [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            # A version with a suffix (3.6.0-rc.1) is a release candidate: a
            # GitHub pre-release, never the latest release (DECISIONS A183)
            case "${version}" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "branch=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npx -y npm@11.6.2 ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-ui-build
          path: web-ui/build
          retention-days: 3

  build:
    needs: [plan, web-ui]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, goarm: '', name: neodesk-server-linux-amd64 }
          - { goos: linux, goarch: arm64, goarm: '', name: neodesk-server-linux-arm64 }
          - { goos: linux, goarch: arm, goarm: '7', name: neodesk-server-linux-armv7 }
          - { goos: windows, goarch: amd64, goarm: '', name: neodesk-server-windows-amd64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-ui-build
          path: ${{ runner.temp }}/web-ui-build
      # The web app goes where the binary embeds it from (DECISIONS A25),
      # with the time of every file, and the times of the console's own
      # files (console/static/files) are recorded. The step runs for the
      # build machine, before GOOS and GOARCH are set.
      - name: Embed the web app
        working-directory: ${{ env.SERVER_DIR }}
        run: go run ./cmd/embed-webui -from "${RUNNER_TEMP}/web-ui-build"
      - name: Build
        working-directory: ${{ env.SERVER_DIR }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.plan.outputs.version }}
          CREATED: ${{ needs.plan.outputs.created }}
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${CREATED}" \
            -o "../dist/${{ matrix.name }}" .
      - name: Check the -version line the updater reads
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          line="$(./dist/${{ matrix.name }} -version)"
          echo "$line"
          [ "$line" = "neodesk-server ${{ needs.plan.outputs.version }} (built ${{ needs.plan.outputs.created }}, commit ${GITHUB_SHA})" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          retention-days: 3

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release notes list the commits since the release before
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: neodesk-server-*
          path: dist
          merge-multiple: true
      - name: The installers and compose files
        run: cp install/install.sh install/neodesk.sh install/neodesk.ps1 install/neodesk-docker.sh install/docker-compose*.yml dist/
      - name: Manifest, signature and checksums
        working-directory: ${{ env.SERVER_DIR }}
        env:
          NEODESK_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.NEODESK_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          args=(-dir ../dist -version "${{ needs.plan.outputs.version }}" -commit "${GITHUB_SHA}"
                -branch "${{ needs.plan.outputs.branch }}" -owner "${GITHUB_REPOSITORY_OWNER}"
                -repo "${GITHUB_REPOSITORY#*/}" -created "${{ needs.plan.outputs.created }}")
          if [ -n "${PUBLIC_KEY}" ]; then args+=(-verify-key "${PUBLIC_KEY}"); fi
          go run ./cmd/release-manifest "${args[@]}"
      - name: Check the release as the updater does
        working-directory: dist
        env:
          PUBLIC_KEY: ${{ vars.NEODESK_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          cd "../${SERVER_DIR}"
          go run ./cmd/release-manifest -check -dir ../dist -branch "${{ needs.plan.outputs.branch }}" \
            -owner "${GITHUB_REPOSITORY_OWNER}" -repo "${GITHUB_REPOSITORY#*/}" -verify-key "${PUBLIC_KEY}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(dist/neodesk-server-* dist/manifest.json dist/SHA256SUMS
                 dist/install.sh dist/neodesk.sh dist/neodesk.ps1 dist/neodesk-docker.sh dist/docker-compose*.yml)
          [ -f dist/manifest.sig ] && files+=(dist/manifest.sig)
          [ -f dist/SHA256SUMS.sig ] && files+=(dist/SHA256SUMS.sig)
          # A new release is made as a draft with all its files and published
          # afterwards: the updater sees no release or a whole one.
          # A tag's notes are release-notes/<tag>.md with every commit since
          # the release before (release-notes/body.sh), else GitHub's own.
          notes=(--generate-notes)
          if [ "${TAG}" != dev ] && [ -f "release-notes/${TAG}.md" ]; then
            bash release-notes/body.sh "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
            notes=(--notes-file "${RUNNER_TEMP}/release-notes.md")
          fi
          if [ "${TAG}" = dev ]; then
            # The rolling pre-release is replaced, with its tag, at this commit.
            gh release delete dev --cleanup-tag --yes || true
            gh release create dev "${files[@]}" --draft --prerelease --target "${GITHUB_SHA}" \
              --title "NeoDesk ${VERSION} (development build ${GITHUB_SHA::7})" \
              --notes "Development build of ${GITHUB_SHA}. The development update channel installs it."
            gh release edit dev --draft=false
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          elif [ "${PRERELEASE}" = true ]; then
            # A release candidate stays a pre-release: the stable channel
            # takes it only while there is no stable release
            gh release create "${TAG}" "${files[@]}" --draft --prerelease --verify-tag --title "NeoDesk ${VERSION}" "${notes[@]}"
            gh release edit "${TAG}" --draft=false
          else
            gh release create "${TAG}" "${files[@]}" --draft --verify-tag --title "NeoDesk ${VERSION}" "${notes[@]}"
            gh release edit "${TAG}" --draft=false --latest
          fi
