name: Installer CI

on:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - 'install.sh'
      - 'neodesk.sh'
      - 'neodesk.ps1'
      - 'neodesk-docker.sh'
      - 'scripts/test-go-installer.sh'
      - 'scripts/test-setup-command.sh'
      - 'scripts/test-docker-data-path.sh'
      - 'scripts/build-test-image.sh'
      - 'neodesk-server/cli_cmd.go'
      - 'neodesk-server/cli_setup*.go'
      - 'neodesk-server/cli_client*.go'
      - 'neodesk-server/testdata/client-options.txt'
      - 'scripts/client-options.sh'
      - 'release-notes/**'
      - '.github/workflows/release-go.yml'
      - 'scripts/test-docker-installer.sh'
      - 'scripts/check-supervisor-env.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/check-go-toolchain-pins.sh'
      - 'neodesk-server/go.mod'
      - 'scripts/test-postgresql-hba.sh'
      - 'scripts/test-docker-hardening.sh'
      - 'scripts/docker-latest.sh'
      - 'scripts/test-docker-latest.sh'
      - 'neodesk-server/cli/**'
      - 'neodesk-server/console/safepath/**'
      - 'neodesk-server/console/updater/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'docker/**'
      - '.github/workflows/installer-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.sh'
      - 'install.sh'
      - 'neodesk.sh'
      - 'neodesk.ps1'
      - 'neodesk-docker.sh'
      - 'scripts/test-go-installer.sh'
      - 'scripts/test-setup-command.sh'
      - 'scripts/test-docker-data-path.sh'
      - 'scripts/build-test-image.sh'
      - 'neodesk-server/cli_cmd.go'
      - 'neodesk-server/cli_setup*.go'
      - 'neodesk-server/cli_client*.go'
      - 'neodesk-server/testdata/client-options.txt'
      - 'scripts/client-options.sh'
      - 'release-notes/**'
      - '.github/workflows/release-go.yml'
      - 'scripts/test-docker-installer.sh'
      - 'scripts/check-supervisor-env.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/check-go-toolchain-pins.sh'
      - 'neodesk-server/go.mod'
      - 'scripts/test-postgresql-hba.sh'
      - 'scripts/test-docker-hardening.sh'
      - 'scripts/docker-latest.sh'
      - 'scripts/test-docker-latest.sh'
      - 'neodesk-server/cli/**'
      - 'neodesk-server/console/safepath/**'
      - 'neodesk-server/console/updater/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'docker/**'
      - '.github/workflows/installer-ci.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published GHCR tag to smoke-test with the files of its own release; empty tests the image of this checkout'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: installer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-static:
    name: Bash installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check that the top-level scripts are executable in git
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- ':(glob)*.sh' | awk '$1 != "100755" { print $4 }')"
          if [ -n "$bad" ]; then
            echo "These scripts are not executable in git, so ./script.sh fails in a fresh clone:"
            printf '%s\n' "$bad" | sed 's/^/  /'
            echo "Fix: git update-index --chmod=+x <script>"
            exit 1
          fi
      - name: Parse all Bash installers
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(printf '%s\n' \
            install.sh \
            neodesk.sh \
            neodesk-docker.sh \
            scripts/test-native-installer.sh \
            scripts/test-go-installer.sh \
            scripts/test-setup-command.sh \
            scripts/test-docker-data-path.sh \
            scripts/build-test-image.sh \
            scripts/test-docker-installer.sh \
            scripts/check-supervisor-env.sh \
            scripts/check-go-toolchain-pins.sh \
            scripts/test-postgresql-hba.sh \
            scripts/test-docker-hardening.sh \
            scripts/docker-latest.sh \
            scripts/test-docker-latest.sh)
      - name: Run ShellCheck
        run: |
          shellcheck --severity=error \
            install.sh \
            neodesk.sh \
            neodesk-docker.sh \
            scripts/test-native-installer.sh \
            scripts/test-go-installer.sh \
            scripts/test-setup-command.sh \
            scripts/test-docker-data-path.sh \
            scripts/build-test-image.sh \
            scripts/test-docker-installer.sh \
            scripts/check-supervisor-env.sh \
            scripts/check-go-toolchain-pins.sh \
            scripts/test-postgresql-hba.sh \
            scripts/test-docker-hardening.sh \
            scripts/docker-latest.sh \
            scripts/test-docker-latest.sh
      - name: Test the native installer's functions (update, the way back, the commands)
        run: bash scripts/test-go-installer.sh
      - name: Check the Go pins of the installers against go.mod
        run: bash scripts/check-go-toolchain-pins.sh
      - name: Test the Docker manager's update and backup
        run: bash scripts/test-docker-installer.sh
      - name: Test which release moves the Docker images' latest tag
        run: bash scripts/test-docker-latest.sh
      - name: Check that the systemd unit and the image name their supervisor
        run: bash scripts/check-supervisor-env.sh
      - name: Test the Windows installer's service and task set-up
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Test native installer watchdog and clone recovery
        run: bash scripts/test-native-installer.sh
      - name: Test PostgreSQL pg_hba.conf setup
        run: bash scripts/test-postgresql-hba.sh

  powershell-static:
    name: PowerShell installer syntax
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $files = @(
            "neodesk.ps1",
            "scripts/test-windows-installer.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "$file failed to parse: $($messages -join '; ')"
            }
          }

  installer-unit:
    name: Installer reliability unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neodesk-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      # The subcommands the installers call (check, env merge, config,
      # reset-password), the path checks and the updater
      - name: Run installer-focused tests
        run: go test -count=1 ./cli/... ./console/safepath/... ./console/updater/...
      # neodesk hands neodesk.sh's options to neodesk-setup and the desktop
      # client's to /usr/bin/neodesk: the lists in Go against the
      # installer's argument loop and the client's (testdata), and the
      # hand-overs themselves
      - name: Test the hand-over of the installer's and the client's options
        run: go test -count=1 -run 'Setup|InstallersFlags|OtherCallsStay|BareSudo|Client' .

  setup-command:
    name: Installer commands on a real install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the server
        working-directory: neodesk-server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .
      # A fresh install, the installer's options through neodesk, an update
      # by neodesk-setup and one by the old manager of 3.6.0-rc.4, and the
      # uninstall
      - name: Install, update and uninstall on this runner
        run: sudo NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/test-setup-command.sh

  docker-data-path:
    name: Docker data folder on a real install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the server
        working-directory: neodesk-server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .
      # An install of 3.6.0-rc.4 with data, updated to the image of this
      # checkout (data volume at /opt/neodesk/data), and its backup from
      # before the update put back
      - name: Update an install of 3.6.0-rc.4 and restore its backup
        run: NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/test-docker-data-path.sh

  installer-dry-run:
    name: Installer non-mutating CLI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify help paths do not mutate the host
        run: |
          set -euo pipefail
          bash install.sh --help >/dev/null
          bash neodesk.sh --help >/dev/null
          bash neodesk-docker.sh --help >/dev/null

  compose-static:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_PASSWORD: installer-ci-placeholder
      MACVLAN_IPV4: 192.0.2.51
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate compose manifests
        run: |
          set -euo pipefail
          for file in \
            docker-compose.single.yml \
            docker-compose.quick.single.yml \
            docker-compose.quick.single.macvlan.yml; do
            docker compose -f "$file" config --quiet
          done

  # The smoke tests run the compose files with the image they belong to:
  # the image of this checkout, or with image_tag a published image and the
  # files of the release it was built from (a compose file of this checkout
  # can name paths an older image does not have)
  docker-hardening-smoke:
    name: Docker hardened bind-mount smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEODESK_IMAGE_TAG: ${{ inputs.image_tag || 'local' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.image_tag }}
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the image of this checkout
        if: ${{ !inputs.image_tag }}
        run: |
          set -euo pipefail
          (cd neodesk-server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .)
          NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/build-test-image.sh "$NEODESK_IMAGE_TAG"
      - name: Check out the release of the published image
        if: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/neodeskapp/neodesk:$NEODESK_IMAGE_TAG"
          docker pull -q "$image"
          revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "$image names no revision"; exit 1; }
          git fetch --depth=1 origin "$revision"
          git checkout --detach FETCH_HEAD
      - name: Verify hardened bind mounts and restart behavior
        run: bash scripts/test-docker-hardening.sh

  docker-runtime-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEODESK_IMAGE_TAG: ${{ inputs.image_tag || 'local' }}
      ADMIN_PASSWORD: InstallerSmoke-ChangeMe-9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.image_tag }}
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the image of this checkout
        if: ${{ !inputs.image_tag }}
        run: |
          set -euo pipefail
          (cd neodesk-server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .)
          NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/build-test-image.sh "$NEODESK_IMAGE_TAG"
      - name: Check out the release of the published image
        if: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/neodeskapp/neodesk:$NEODESK_IMAGE_TAG"
          docker pull -q "$image"
          revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "$image names no revision"; exit 1; }
          git fetch --depth=1 origin "$revision"
          git checkout --detach FETCH_HEAD
      - name: Start official single-container stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.quick.single.yml up -d --wait --pull never
      - name: Verify API and console health
        run: |
          set -euo pipefail
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:21121/api/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:5000/health
          docker compose -f docker-compose.quick.single.yml exec -T -u neodesk neodesk \
            /usr/local/bin/neodesk-server check \
            --api http://127.0.0.1:21121/api/health \
            --panel http://127.0.0.1:5000/health \
            --port 127.0.0.1:21121
          docker compose -f docker-compose.quick.single.yml ps
      - name: Tear down smoke stack
        if: always()
        run: docker compose -f docker-compose.quick.single.yml down -v
