# NeoDesk Go server: vet, race tests on SQLite and PostgreSQL, the
# release build
name: Go Server CI

on:
  push:
    branches: [main]
    paths:
      - 'neodesk-server/**'
      - 'web-ui/**'
      - '.github/test-times.json'
      - '.github/workflows/go-server-ci.yml'
  pull_request:
    paths:
      - 'neodesk-server/**'
      - 'web-ui/**'
      - '.github/test-times.json'
      - '.github/workflows/go-server-ci.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is
# still going
concurrency:
  group: go-server-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: neodesk-server

jobs:
  vet:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache: false

      # The module cache every Go job of CI restores; this job saves it when
      # go.sum changed
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('neodesk-server/go.sum') }}

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  # The race tests take more than half an hour on one runner, so they run
  # on several per database. .github/test-times.json holds how long each
  # package and each long test took in earlier runs; repotool test-shards
  # deals the packages out by it, the longest first to the shard with the
  # least time so far, and cuts a package longer than --split-over seconds
  # into parts by its tests (a test that long by its subtests). Tests and
  # packages the file does not know yet still run, in the last part of
  # their package or as a package of ten seconds. A shard takes about as
  # long as its longest test, plus a minute to start; the longest is cli
  # TestResetPasswordLikeNode, five to six minutes, which has no subtests
  # to cut it by.
  #
  # Each shard uploads the times it measured (test-times-*). To refresh
  # the file from a green run:
  #
  #   gh run download <run id> -R neodeskapp/neodesk -p 'test-times-*' -D /tmp/times
  #   cd neodesk-server
  #   go run ./cmd/repotool test-shards merge --out ../.github/test-times.json /tmp/times/*/test-times.json
  #   go run ./cmd/repotool test-shards plan --set go-race-postgres --shards 9 --split-over 240
  #
  # The PostgreSQL shards run every test with NEODESK_TEST_POSTGRES_DSN
  # set, so the store tests run on both databases there; the SQLite shards
  # run them without it, as an install without PostgreSQL does.
  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    name: go test (${{ matrix.db }} ${{ matrix.shard }} of ${{ matrix.db == 'sqlite' && 7 || 9 }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 7 shards on SQLite, 9 on PostgreSQL, where the store tests run twice
      matrix:
        db: [sqlite, postgres]
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        exclude:
          - { db: sqlite, shard: 8 }
          - { db: sqlite, shard: 9 }
    services:
      postgres:
        # No image, no service: the SQLite shards go without
        image: ${{ matrix.db == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: neodesk
          POSTGRES_DB: neodesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neodesk -d neodesk_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('neodesk-server/go.sum') }}

      # The race build of every test binary, saved by the job "go test cache"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-${{ hashFiles('neodesk-server/go.sum') }}
          restore-keys: |
            go-race-${{ hashFiles('neodesk-server/go.sum') }}-
            go-race-

      # The tests open many connections side by side, and need no
      # durability. The server is reached as bdgo-testpg, the name of the
      # local test database, which recordings of the Node tools print.
      - name: Set up PostgreSQL for the tests
        if: matrix.db == 'postgres'
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          echo "127.0.0.1 bdgo-testpg" | sudo tee -a /etc/hosts >/dev/null
          docker exec "$PG" psql -U neodesk -d neodesk_test -q \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$PG" >/dev/null
          for _ in $(seq 1 60); do
            docker exec "$PG" pg_isready -U neodesk -d neodesk_test -q && exit 0
            sleep 1
          done
          echo "PostgreSQL did not come back"
          exit 1

      - name: go test
        env:
          NEODESK_TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://neodesk@bdgo-testpg:5432/neodesk_test?sslmode=disable' || '' }}
          SET: go-race-${{ matrix.db }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.db == 'sqlite' && 7 || 9 }}
        run: >-
          go run ./cmd/repotool test-shards run --set "$SET" --shards "$SHARDS" --shard "$SHARD"
          --split-over 240 --times-out "$RUNNER_TEMP/test-times.json"
          -- -race -count=1 -timeout 25m

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-times-go-race-${{ matrix.db }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # Builds every test binary with the race detector once a day (and when
  # go.sum changes) and saves the build cache the shards start from. The
  # shards do not wait for it: they take the newest cache there is.
  race-cache:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    name: go test cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache: false

      - name: Name today's cache
        id: key
        run: echo "key=go-race-${{ hashFiles('neodesk-server/go.sum') }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: today
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.today.outputs.cache-hit != 'true'
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('neodesk-server/go.sum') }}

      # Test failures and build errors are the shards' to report
      - name: Build every test binary with the race detector
        if: steps.today.outputs.cache-hit != 'true'
        run: go test -race -count=1 -run '^$' ./... > /dev/null 2>&1 || true

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.today.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}

  mesh-interop:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('neodesk-server/go.sum') }}

      - name: Mesh interop (simulated handshake)
        working-directory: neodesk-server
        run: go test ./meshcentral/... -count=1 -timeout 5m

      - name: Mesh interop (live MeshAgent binary)
        working-directory: neodesk-server
        continue-on-error: true
        run: go test -tags=meshagent_live ./meshcentral/... -run TestMeshAgentLiveConnect -count=1 -timeout 10m

  # The release build: the web app and the console's own files go into the
  # binary (cmd/embed-webui), then it builds. The language files are checked
  # here too, since they are part of the server now.
  embed:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build the web app
        working-directory: web-ui
        run: |
          npx -y npm@11.6.2 ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('neodesk-server/go.sum') }}

      - name: Check the console's language files
        run: go run ./cmd/repotool i18n-check --system console

      - name: Embed the web app and record the times of the console's files
        run: go run ./cmd/embed-webui

      - name: The embedded folders hold what the binary serves
        run: |
          test -f console/webui/dist/index.html
          test -s console/webui/dist/.embedfs-times.json
          test -s console/static/files/.embedfs-times.json

      - name: Build with the embedded files
        run: go build -o /tmp/neodesk-server . && /tmp/neodesk-server -version
