# Gitleaks configuration for NeoDesk
# Suppresses false positives from auto-generated lock files

title = "NeoDesk Gitleaks Config"

[allowlist]
  description = "Allowlisted files and patterns"

  # Cargo.lock files contain crate checksums and dependency names like
  # "crypto_secretbox" that trigger generic-api-key false positives.
  paths = [
    '''\.github/gitleaks\.toml$''',
    '''.*Cargo\.lock$''',
    '''.*package-lock\.json$''',
    '''docs/private/''',
    '''scripts/check-no-sensitive-paths\.sh''',
    '''\.cargo-cache/''',
    '''node_modules/''',
    '''neodesk-agent-client/src-tauri/binaries/''',
    '''neodesk-agent-client/src-tauri/target/''',
    '''rdclient-desktop/src-tauri/target/''',
    '''neodesk-mgmt/''',
  ]

# Operator-specific infrastructure fingerprints — must not reappear in tracked files.
[[rules]]
id = "neodesk-internal-lan-ip"
description = "Known internal LAN IP used in operator docs (use 203.0.113.x instead)"
regex = '''192\.168\.0\.110'''
tags = ["neodesk", "infrastructure"]

[[rules]]
id = "neodesk-operator-home-path"
description = "Developer home path that must not be committed"
regex = '''/home/unitronix'''
tags = ["neodesk", "infrastructure"]

[[rules]]
id = "neodesk-operator-ssh"
description = "SSH user@internal IP pattern from operator runbooks"
regex = '''unitronix@192\.168'''
tags = ["neodesk", "infrastructure"]

# API tokens of the console (console/admintoken). A match is a live
# credential: revoke it under API tokens in the console.
[[rules]]
id = "neodesk-api-token"
description = "NeoDesk API token (ndt_): revoke it in the console under API tokens"
regex = '''\bndt_[a-km-z2-9]{12}_[A-Za-z0-9]{40}\b'''
tags = ["neodesk", "token"]
