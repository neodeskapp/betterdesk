# =============================================================================
# NeoDesk — automatic patch version bump on the main branch
# =============================================================================
# Every push to main (except version-bump commits) bumps product version +0.0.1
# across Tier 1/2 files via repotool bump-version (neodesk-server/cmd/repotool).
# Stable releases come from v* tags (release-go.yml), not from this workflow.
#
# After a successful bump push, explicitly dispatch docker-publish (tag=dev).
# GITHUB_TOKEN branch pushes do not re-trigger other workflows, so relying on
# the bump commit alone would never republish GHCR :dev (#401).
# =============================================================================

name: Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-patch:
    # Skip only real auto-bump commits (subject line), not feature messages that
    # happen to mention the marker in the body.
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore: release ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum

      - name: Bump patch version
        id: bump
        run: |
          go -C neodesk-server run ./cmd/repotool bump-version --patch
          NEW_VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        id: commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go -C neodesk-server run ./cmd/repotool bump-version --list-paths | xargs git add --
          if git diff --cached --quiet; then
            echo "No version files changed — skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump version to ${NEW_VERSION} [version-bump]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/5) — rebasing and retrying..."
            if ! git pull --rebase origin refs/heads/main; then
              git rebase --abort || true
              echo "The bump does not rebase onto main without conflicts"
              exit 1
            fi
          done
          echo "Version bump push failed after retries"
          exit 1

      - name: Trigger GHCR :dev image publish
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Explicit dispatch — bump commits from GITHUB_TOKEN do not start workflows.
          gh workflow run .github/workflows/docker-publish.yml --ref main -f tag=dev
          echo "Dispatched docker-publish for :dev (VERSION ${{ steps.bump.outputs.version }})"
