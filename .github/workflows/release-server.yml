# =============================================================================
# BetterDesk Go Server — Cross-Compile & Release
# =============================================================================
# Builds Go server binary for Linux (amd64, arm64) and Windows (amd64), and
# the migration tool for Linux (amd64).
# Triggers on main/dev pushes, version tag pushes (v*) or manual dispatch.
# Every run keeps the binaries with their manifests as artifacts of the run.
# Nothing is attached to a GitHub Release: release-go.yml is the only
# workflow that publishes binaries there, with the web console built in and
# the manifest the updater checks.
# =============================================================================

name: Build & Release Go Server

on:
  push:
    branches: [main, dev]
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_DIR: betterdesk-server

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build binary
        working-directory: ${{ env.SERVER_DIR }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="$(tr -d '\r\n' < ../VERSION)"
          BINARY_NAME="betterdesk-server-${{ matrix.suffix }}"
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "${BINARY_NAME}" .
          SHA256="$(sha256sum "${BINARY_NAME}" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "${BINARY_NAME}")"
          cat > "${BINARY_NAME}.manifest.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "version": "${VERSION}",
            "goos": "${{ matrix.goos }}",
            "goarch": "${{ matrix.goarch }}",
            "asset": "${BINARY_NAME}",
            "size": ${SIZE},
            "sha256": "${SHA256}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: betterdesk-server-${{ matrix.suffix }}
          path: |
            ${{ env.SERVER_DIR }}/betterdesk-server-${{ matrix.suffix }}
            ${{ env.SERVER_DIR }}/betterdesk-server-${{ matrix.suffix }}.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Migration tool
  # ---------------------------------------------------------------------------
  build-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum

      - name: Build migration tool (linux-amd64)
        working-directory: ${{ env.SERVER_DIR }}/tools/migrate
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -ldflags="-s -w" -o migrate-linux-amd64 .

      - name: Upload migration tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: migrate-linux-amd64
          path: ${{ env.SERVER_DIR }}/tools/migrate/migrate-linux-amd64
