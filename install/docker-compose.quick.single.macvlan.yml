# =============================================================================
# NeoDesk with Docker on a macvlan network (its own LAN address)
# =============================================================================
# The published image, as docker-compose.quick.single.yml runs it, but on a
# macvlan network instead of ports on the host: the container gets its own
# address on your LAN (MACVLAN_IPV4). It builds nothing.
#
# Which compose file is which:
#   docker-compose.quick.single.yml          the published image, ports on
#                                            the host (start from this one)
#   docker-compose.quick.single.macvlan.yml  this file
#   docker-compose.single.yml                builds the image from a checkout
#                                            of the repository (development)
#
# Prerequisites:
#   - External macvlan network already created on the Docker host (example below).
#   - A free IPv4 on that subnet (MACVLAN_IPV4).
#
# Create macvlan (once per host; adjust parent interface and subnet):
#   docker network create -d macvlan #     --subnet=192.168.1.0/24 --gateway=192.168.1.1 #     -o parent=eth0 LAN
#
# Usage (MACVLAN_IPV4 and RELAY_SERVERS can also go into .env):
#   export MACVLAN_IPV4=192.168.1.51
#   export RELAY_SERVERS=${MACVLAN_IPV4}:21117
#   curl -fsSL https://neode.sk/install/docker-compose.quick.single.macvlan.yml -o docker-compose.yml
#   docker compose up -d
#
# Web console: http://MACVLAN_IPV4:5000
# RustDesk client API: http://MACVLAN_IPV4:21121
# Admin password:
#   docker compose exec neodesk neodesk-show-admin-credentials
#
# Image: ghcr.io/neodeskapp/neodesk with the tag "latest", the newest
# release. Update: docker compose pull && docker compose up -d
# Pin a release: NEODESK_IMAGE_TAG=<version> in .env. An image of
# 3.6.0-rc.4 or older keeps its data in /opt/rustdesk: pinned to one, also
# NEODESK_DATA_PATH=/opt/rustdesk in .env.
# =============================================================================

services:
  neodesk:
    image: ghcr.io/neodeskapp/neodesk:${NEODESK_IMAGE_TAG:-latest}
    container_name: neodesk
    hostname: neodesk
    volumes:
      - neodesk-data:${NEODESK_DATA_PATH:-/opt/neodesk/data}
      - console-data:/app/data
    # Every KEY=value of .env next to this file reaches the server; the
    # entries under environment below win over it.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # Set TRUST_PROXY=1 when the panel is behind one reverse proxy.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CONSOLE_PORT=5000
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - API_ENABLED=false
      - ENCRYPTED_ONLY=1
      - SERVER_BACKEND=neodesk
      - HBBS_API_URL=http://127.0.0.1:21121/api
      - NEODESK_API_URL=http://127.0.0.1:21121/api
      - RUSTDESK_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}
      - DATA_DIR=/app/data
      - NEODESK_CLIENT_REPO=${NEODESK_CLIENT_REPO:-neodeskapp/neodesk-client}
      - NEODESK_CLIENT_RELEASE_TAG=${NEODESK_CLIENT_RELEASE_TAG:-}
      - NEODESK_GITHUB_TOKEN=${NEODESK_GITHUB_TOKEN:-}
      - NEODESK_CUSTOM_CLIENT_SIGNING_SEED=${NEODESK_CUSTOM_CLIENT_SIGNING_SEED:-}
      - AGENT_ARTIFACT_DIR=/app/data/agent-builds
      - AGENT_BUILD_WORKER=${AGENT_BUILD_WORKER:-on}
      - AGENT_BUILD_POLL_MS=${AGENT_BUILD_POLL_MS:-5000}
      - AGENT_BUILD_COOLDOWN_MS=${AGENT_BUILD_COOLDOWN_MS:-1000}
      - DB_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/db_v2.sqlite3
      - PUB_KEY_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/id_ed25519.pub
      - API_KEY_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/.api_key
      - DOCKER=true
      # Optional: map neodesk to host bind-mount owner (Synology etc.). Default 10001.
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      - NEODESK_UPDATE_MODE=image
      - NEODESK_DOCKER_LAYOUT=single
      - NEODESK_IMAGE_TAG=${NEODESK_IMAGE_TAG:-latest}
      - AUTH_DB_PATH=/app/data/auth.db
      # Do NOT comment these out — host ADMIN_PASSWORD only reaches the container when mapped.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INIT_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASS=${ADMIN_PASSWORD:-}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - RELAY_SERVERS=${RELAY_SERVERS:-}
      - SIGNAL_RATE_LIMIT_PER_IP=${SIGNAL_RATE_LIMIT_PER_IP:-20}
      - ALLOW_LEGACY_OUTBOUND=${ALLOW_LEGACY_OUTBOUND:-N}
      - ENROLLMENT_MODE=${ENROLLMENT_MODE:-}
      - ENROLLMENT_MODE_ENV_OVERRIDE=${ENROLLMENT_MODE_ENV_OVERRIDE:-}
      - TZ=${TZ:-UTC}
    networks:
      lan:
        ipv4_address: ${MACVLAN_IPV4:?Set MACVLAN_IPV4 e.g. 192.168.1.51}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
    healthcheck:
      test: ["CMD", "/usr/local/bin/neodesk-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  lan:
    name: ${MACVLAN_NETWORK:-LAN}
    external: true

volumes:
  neodesk-data:
    name: neodesk-data
  console-data:
    name: neodesk-console-data
