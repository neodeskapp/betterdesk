# =============================================================================
# BetterDesk with Docker: the compose file to start from
# =============================================================================
# It runs the published image and builds nothing: one container, one process
# (signal, relay, API and the web console).
#
# Which compose file is which:
#   docker-compose.quick.single.yml          this file: the published image
#   docker-compose.quick.single.macvlan.yml  the published image on a macvlan
#                                            network, with its own LAN address
#   docker-compose.single.yml                builds the image from a checkout
#                                            of the repository (development)
#
# Install with the script. It saves this file as docker-compose.yml with a
# .env next to it in /opt/betterdesk/docker, starts it and prints how to
# sign in:
#   curl -fsSL https://raw.githubusercontent.com/trybetterdesk/betterdesk/main/betterdesk-docker.sh -o betterdesk-docker.sh
#   sudo bash betterdesk-docker.sh
#
# Or by hand:
#   curl -fsSL https://raw.githubusercontent.com/trybetterdesk/betterdesk/main/docker-compose.quick.single.yml -o docker-compose.yml
#   docker compose up -d
#   docker compose exec betterdesk betterdesk-show-admin-credentials
#
# Image: ghcr.io/trybetterdesk/betterdesk with the tag "latest", the newest
# release. Update to the newest release:
#   docker compose pull && docker compose up -d
# Pin a release instead: put BETTERDESK_IMAGE_TAG=<version> (for example
# 3.5.270) into .env next to this file.
#
# Settings go into .env next to this file, one KEY=value per line:
#   RELAY_SERVERS=203.0.113.10     the address clients reach this server at
#                                  (found by itself at every start when empty)
#   BETTERDESK_CONSOLE_PORT=5080   the host port of the web console (5000)
#   ADMIN_PASSWORD=...             the admin's password, at the first start only
#   TRUST_PROXY=1                  the console is behind one reverse proxy
#
# Web console: http://<server>:5000
# RustDesk clients: ID server and relay <server>, API http://<server>:21121
# Logs: docker compose logs -f betterdesk
# =============================================================================

services:
  betterdesk:
    image: ghcr.io/trybetterdesk/betterdesk:${BETTERDESK_IMAGE_TAG:-latest}
    container_name: betterdesk
    hostname: betterdesk
    ports:
      - "${BETTERDESK_CONSOLE_PORT:-5000}:5000"  # Web console
      - "21115:21115"           # NAT type test
      - "21116:21116/tcp"       # Signal TCP
      - "21116:21116/udp"       # Signal UDP
      - "21117:21117"           # Relay TCP
      - "21118:21118"           # WebSocket Signal
      - "21119:21119"           # WebSocket Relay
      - "21121:21121"           # HTTP API (RustDesk client + REST)
    volumes:
      - betterdesk-data:/opt/rustdesk
      - console-data:/app/data
    environment:
      - NODE_ENV=production
      # Set TRUST_PROXY=1 when the panel is behind one reverse proxy.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CONSOLE_PORT=5000
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - API_ENABLED=false
      - ENCRYPTED_ONLY=1
      - SERVER_BACKEND=betterdesk
      - HBBS_API_URL=http://127.0.0.1:21121/api
      - BETTERDESK_API_URL=http://127.0.0.1:21121/api
      - RUSTDESK_PATH=/opt/rustdesk
      - DATA_DIR=/app/data
      - BETTERDESK_CLIENT_REPO=${BETTERDESK_CLIENT_REPO:-UNITRONIX/BetterDesk-Client}
      - BETTERDESK_CLIENT_RELEASE_TAG=${BETTERDESK_CLIENT_RELEASE_TAG:-}
      - BETTERDESK_GITHUB_TOKEN=${BETTERDESK_GITHUB_TOKEN:-}
      - BETTERDESK_CUSTOM_CLIENT_SIGNING_SEED=${BETTERDESK_CUSTOM_CLIENT_SIGNING_SEED:-}
      - AGENT_ARTIFACT_DIR=/app/data/agent-builds
      - AGENT_BUILD_WORKER=${AGENT_BUILD_WORKER:-on}
      - AGENT_BUILD_POLL_MS=${AGENT_BUILD_POLL_MS:-5000}
      - AGENT_BUILD_COOLDOWN_MS=${AGENT_BUILD_COOLDOWN_MS:-1000}
      - DB_PATH=/opt/rustdesk/db_v2.sqlite3
      # Optional public client endpoints (IaC). Non-empty values override
      # /app/data/public-endpoints.env from Settings UI. Leave unset to use the panel.
      # Do not set empty PUBLIC_*= keys.
      # - PUBLIC_SERVER_ID=gateway.example.net
      # - PUBLIC_RELAY_SERVER=gateway.example.net
      # - PUBLIC_API_URL=https://api.example.net:21121
      - PUB_KEY_PATH=/opt/rustdesk/id_ed25519.pub
      - API_KEY_PATH=/opt/rustdesk/.api_key
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Panel session policy (empty = built-in defaults)
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-}
      - SESSION_IDLE_WARN_MS=${SESSION_IDLE_WARN_MS:-}
      - SESSION_MAX_PER_USER=${SESSION_MAX_PER_USER:-}
      - DOCKER=true
      # Optional: map betterdesk to host bind-mount owner (Synology etc.). Default 10001.
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      - BETTERDESK_UPDATE_MODE=image
      - BETTERDESK_DOCKER_LAYOUT=single
      - BETTERDESK_IMAGE_TAG=${BETTERDESK_IMAGE_TAG:-latest}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_URL=${DATABASE_URL:-}
      # The address clients reach this server at: the host's public IP or
      # DNS name, or its LAN address for a LAN-only server. Found at every
      # start when empty.
      - RELAY_SERVERS=${RELAY_SERVERS:-}
      - SIGNAL_RATE_LIMIT_PER_IP=${SIGNAL_RATE_LIMIT_PER_IP:-20}
      - ALLOW_LEGACY_OUTBOUND=${ALLOW_LEGACY_OUTBOUND:-N}
      # Enrollment mode of the first start ("open", "managed" or "locked").
      # Fresh volumes default to "managed"; a mode saved in the console stays
      # across restarts. ENROLLMENT_MODE_ENV_OVERRIDE=Y forces this value at
      # every start instead.
      - ENROLLMENT_MODE=${ENROLLMENT_MODE:-}
      - ENROLLMENT_MODE_ENV_OVERRIDE=${ENROLLMENT_MODE_ENV_OVERRIDE:-}
      - NTP_SERVERS=${NTP_SERVERS:-pool.ntp.org,time.google.com,time.cloudflare.com}
      - BILLING_MAX_CLOCK_SKEW_MS=${BILLING_MAX_CLOCK_SKEW_MS:-2000}
      - BILLING_REQUIRE_SYNCED_CLOCK=${BILLING_REQUIRE_SYNCED_CLOCK:-1}
      - BILLING_TRUST_OS_NTP=${BILLING_TRUST_OS_NTP:-Y}
      - AUTH_DB_PATH=/app/data/auth.db
      # The admin account of the first start. Without ADMIN_PASSWORD the
      # container makes a random password; betterdesk-show-admin-credentials
      # prints it. An account that exists keeps its password.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INIT_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASS=${ADMIN_PASSWORD:-}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC}
    networks:
      - betterdesk-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:21121/api/health && curl -sf http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  betterdesk-net:
    driver: bridge

volumes:
  betterdesk-data:
    name: betterdesk-data
  console-data:
    name: betterdesk-console-data
