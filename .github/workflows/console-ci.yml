# The console against a running server: the contract suite
# (betterdesk-server/console/contract) and the web app's Playwright tests
# (web-ui/e2e). Each job starts its own seeded test instance
# (.github/test-stack) from the server the build job makes.
name: Console CI

on:
  push:
    branches: [main, ci-shard-test]
    paths:
      - 'betterdesk-server/**'
      - 'web-ui/**'
      - '.github/test-stack/**'
      - '.github/test-times.json'
      - '.github/workflows/console-ci.yml'
  pull_request:
    paths:
      - 'betterdesk-server/**'
      - 'web-ui/**'
      - '.github/test-stack/**'
      - '.github/test-times.json'
      - '.github/workflows/console-ci.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is
# still going
concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# As the release builds the server; the suite and repotool share its cache
env:
  CGO_ENABLED: '0'

jobs:
  # The server with the web app inside, as the release builds it, and
  # devseed, which seeds the test instances
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    name: build the test server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build the web app
        working-directory: web-ui
        run: |
          npx -y npm@11.6.2 ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: betterdesk-server/go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('betterdesk-server/go.sum') }}

      # Saved once a day; the contract jobs restore it
      - name: Name today's build cache
        id: key
        run: echo "key=go-build-${{ hashFiles('betterdesk-server/go.sum') }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            go-build-${{ hashFiles('betterdesk-server/go.sum') }}-
            go-build-

      - name: Build the server and devseed
        working-directory: betterdesk-server
        run: |
          go run ./cmd/embed-webui
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/betterdesk-server" .
          go build -o "$RUNNER_TEMP/bin/devseed" ./cmd/devseed
          go test -tags contract -c -o /dev/null ./console/contract
          go build -o /dev/null ./cmd/repotool

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-server
          path: ${{ runner.temp }}/bin
          retention-days: 1

  # The contract suite as `contract.sh check all` runs it on the local
  # stack: the matrix on one fresh instance, the cases on another. The
  # goldens are answers of SQLite installs, so the instances use SQLite.
  #
  # The cases run on one runner, all groups in name order: some goldens
  # hold what earlier groups left on the instance, so a group alone gives
  # other answers. repotool test-shards can deal the groups over several
  # runners by their times in .github/test-times.json (set
  # contract-cases, --under TestCases) once they no longer depend on each
  # other: raise "shards" below.
  contract:
    needs: build
    name: contract (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.part.trial == true }}
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: matrix, layer: matrix }
          - { name: cases, layer: cases, shard: 1, shards: 1 }
          - { name: cases 1 of 3 trial, layer: cases, shard: 1, shards: 3, trial: true }
          - { name: cases 2 of 3 trial, layer: cases, shard: 2, shards: 3, trial: true }
          - { name: cases 3 of 3 trial, layer: cases, shard: 3, shards: 3, trial: true }
    env:
      # What contract.sh sets: uncovered routes are listed, not failed
      CONTRACT_COVERAGE: report
      LAYER: ${{ matrix.part.layer }}
      SHARD: ${{ matrix.part.shard }}
      SHARDS: ${{ matrix.part.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-server
          path: ${{ runner.temp }}/bin

      # The instance seeds itself while the suite builds. Its name has the
      # shape of the local stack's (ct-<6 hex>-<layer>).
      - name: Start a test instance
        run: |
          name="ct-$(head -c 3 /dev/urandom | od -An -tx1 | tr -d ' \n')-$LAYER"
          echo "INSTANCE=$name" >> "$GITHUB_ENV"
          bash .github/test-stack/up.sh start "$name" "$RUNNER_TEMP/bin"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: betterdesk-server/go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('betterdesk-server/go.sum') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ hashFiles('betterdesk-server/go.sum') }}
          restore-keys: |
            go-build-${{ hashFiles('betterdesk-server/go.sum') }}-
            go-build-

      - name: Build the suite
        working-directory: betterdesk-server
        run: |
          go test -tags contract -c -o /dev/null ./console/contract
          go build -o /dev/null ./cmd/repotool

      - name: go vet with the contract tag
        if: matrix.part.layer == 'matrix'
        working-directory: betterdesk-server
        run: go vet -tags contract ./console/contract

      - name: Wait for the test instance
        run: bash .github/test-stack/up.sh wait "$INSTANCE"

      - name: Check the matrix
        if: matrix.part.layer == 'matrix'
        working-directory: betterdesk-server/console/contract
        run: |
          export BD_URL="http://bdgo-$INSTANCE:5000"
          export BD_PASSWORD_FILE="$RUNNER_TEMP/bdgo-$INSTANCE/secrets/e2e_password"
          export BD_SECRETS_DIR="$RUNNER_TEMP/bdgo-$INSTANCE/secrets"
          go test -tags contract -count=1 -timeout 60m -run '^(TestMatrix|TestEveryRouteIsCovered)$'

      - name: Check the cases
        if: matrix.part.layer == 'cases'
        working-directory: betterdesk-server
        run: |
          export BD_URL="http://bdgo-$INSTANCE:5000"
          export BD_PASSWORD_FILE="$RUNNER_TEMP/bdgo-$INSTANCE/secrets/e2e_password"
          export BD_SECRETS_DIR="$RUNNER_TEMP/bdgo-$INSTANCE/secrets"
          go run ./cmd/repotool test-shards run --set contract-cases --packages ./console/contract \
            --under TestCases --shards "$SHARDS" --shard "$SHARD" --times-out "$RUNNER_TEMP/test-times.json" \
            -- -tags contract -count=1 -timeout 60m

      - name: Logs of the test instance
        if: failure()
        run: bash .github/test-stack/up.sh logs "$INSTANCE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.part.layer == 'cases'
        with:
          name: test-times-contract-cases-${{ matrix.part.shard }}-of-${{ matrix.part.shards }}
          path: ${{ runner.temp }}/test-times.json
          retention-days: 30
          if-no-files-found: ignore

  # The Playwright tests in Chromium and Firefox, cut into shards by
  # Playwright (--shard), each against its own fresh instance
  e2e:
    needs: build
    name: e2e (${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-server
          path: ${{ runner.temp }}/bin

      - name: Start a test instance
        run: bash .github/test-stack/up.sh start e2e "$RUNNER_TEMP/bin"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        working-directory: web-ui
        run: |
          npx -y npm@11.6.2 ci --no-audit --no-fund
          echo "PLAYWRIGHT=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT }}-chromium-firefox

      - name: Install the browsers
        working-directory: web-ui
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then
            npx playwright install-deps chromium firefox
          else
            npx playwright install --with-deps chromium firefox
          fi

      - name: Wait for the test instance
        run: bash .github/test-stack/up.sh wait e2e

      - name: Run the e2e tests
        working-directory: web-ui
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          export BD_URL=http://bdgo-e2e:5000
          export E2E_PASSWORD_FILE="$RUNNER_TEMP/bdgo-e2e/secrets/e2e_password"
          npx playwright test --shard="$SHARD/2"

      - name: Logs of the test instance
        if: failure()
        run: bash .github/test-stack/up.sh logs e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: web-ui/test-results
          retention-days: 7
          if-no-files-found: ignore
