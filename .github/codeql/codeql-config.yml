name: NeoDesk CodeQL

# Dev-only tooling and test harnesses are not production attack surface.
paths-ignore:
  - neodesk-mgmt
  # MeshAgent tunnel TLS pin (checkServerIdentity); not default chain validation.
  - neodesk-server/meshcentral/assets/bettercore.js
  # Vendored wry cookie read helpers (copy Secure from platform cookies).
  - rdclient-desktop/vendor/wry/**

query-filters:
  # --- OIDC discovery/test fetch with SSRF validation (validateOIDCFetchURL + DNS resolve) ---
  - exclude:
      id: go/request-forgery
      paths:
        - neodesk-server/auth/oidc_url.go

  # --- Nonce / ephemeral client ID; not auth secret material ---
  - exclude:
      id: js/insecure-randomness
      paths:
        - web-ui/src/lib/remote/client/connection.ts

  # --- MeshAgent tunnel: pin-based TLS via checkServerIdentity (self-signed agent certs) ---
  - exclude:
      id: js/disabling-certificate-validation
      paths:
        - neodesk-server/meshcentral/assets/bettercore.js

  # --- Legacy / protocol-required hashing (documented; not password storage) ---
  - exclude:
      id: go/weak-sensitive-data-hashing
      paths:
        - neodesk-server/api/auth_handlers.go
        - neodesk-server/main.go

  # --- Agent mTLS / self-signed relay in controlled deployments ---
  - exclude:
      id: go/disabled-certificate-check
      paths:
        - neodesk-agent/agent/agent.go
        # API cert pinning uses VerifyPeerCertificate; development-only
        # insecure TLS is additionally gated by !release and explicit opt-in.

  # --- On-prem TLS opt-in (env / tls_strict UI); default remains strict ---
  - exclude:
      id: rust/disabled-certificate-check
      paths:
        - neodesk-agent-client/src-tauri/src/tls.rs
        - rdclient-desktop/src-tauri/src/server_probe.rs

  # --- Test golden vectors + Tauri handler registration FP (not production secrets) ---
  - exclude:
      id: rust/hard-coded-cryptographic-value
      paths:
        - neodesk-desktop/src/crypto.rs
        - neodesk-agent-client/src-tauri/src/settings_lock.rs
        - neodesk-agent-client/src-tauri/src/lib.rs

  # --- Vendored wry: copies Secure flag from platform cookies (read path) ---
  - exclude:
      id: rust/insecure-cookie
      paths:
        - rdclient-desktop/vendor/wry/**

  # --- Relay conn limit clamped to int32 before NewConnLimiter ---
  - exclude:
      id: go/incorrect-integer-conversion
      paths:
        - neodesk-server/main.go

  - exclude:
      id: go/incorrect-conversion-between-integer-types
      paths:
        - neodesk-server/main.go
