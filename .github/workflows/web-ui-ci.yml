name: Web UI CI

on:
  push:
    branches: [main]
    paths:
      - 'web-ui/**'
      - 'neodesk-server/protos/**'
      - '.github/workflows/web-ui-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-ui/**'
      - 'neodesk-server/protos/**'
      - '.github/workflows/web-ui-ci.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is
# still going
concurrency:
  group: web-ui-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: web-ui

# The checks run side by side in jobs of about two minutes each; the unit
# tests are split in two with vitest --shard (by test file).
jobs:
  check:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: lint
            run: npm run lint
          - name: audit, type check and build
            run: npx -y npm@11.6.2 audit --audit-level=high && npm run check && npm run build
          - name: unit tests (1 of 2)
            run: npx vitest run --shard=1/2
          - name: unit tests (2 of 2)
            run: npx vitest run --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # npm 10 (bundled with Node 22) fails to resolve this dependency tree
      - name: Install dependencies
        run: npx -y npm@11.6.2 ci --no-audit --no-fund

      - name: ${{ matrix.check.name }}
        env:
          CHECK: ${{ matrix.check.run }}
        run: eval "$CHECK"
